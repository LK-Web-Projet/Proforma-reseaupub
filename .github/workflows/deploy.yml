name: Build & Deploy — Proforma

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/lk-web-projet/proforma
  SERVICE: proforma
  COMPOSE_FILE: docker-compose.nextjs.yml
  INFRA_PATH: /srv/reseaupub-shared-project/reseaupub-infra

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy svr-rpubapp
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 54321
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u deployer --password-stdin
            cd ${{ env.INFRA_PATH }}
            git-bot pull origin main
            docker compose --compatibility -f ${{ env.COMPOSE_FILE }} pull ${{ env.SERVICE }}
            docker compose --compatibility -f ${{ env.COMPOSE_FILE }} up -d ${{ env.SERVICE }}

      - name: Notify Discord — succès
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: "Proforma déployé"
          description: "Image : `${{ github.sha }}`"

      - name: Notify Discord — échec
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "Échec déploiement Proforma"
